name: PathForge checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly production-mode regression check; 19:00 UTC is 1 PM MDT.
    - cron: "0 19 * * 2"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit runtime dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements.txt

      - name: Run backend and contract tests
        env:
          PATHFORGE_DATABASE_PATH: ${{ runner.temp }}/pathforge-tests.db
        run: python -m pytest -q

      - name: Run production security regression checks
        env:
          PATHFORGE_ENV: production
          PATHFORGE_DATABASE_PATH: ${{ runner.temp }}/pathforge-security-tests.db
          PATHFORGE_ALLOWED_ORIGINS: https://pathforge.example
        run: >-
          python -m pytest -q
          test_security_hardening.py
          test_auth_rate_limits.py
          test_auth_verification.py
          test_api_auth_integration.py

      - name: Validate JavaScript syntax
        run: |
          node --check pathforge-core.js
          node --check script.js
          node --check service-worker.js
